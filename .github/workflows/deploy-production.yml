name: Deploy to Production

on:
  # Auto-trigger after successful Build & Release on allowed branches
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
    branches: [main, feature/cd-ambientes-rollback-approvals]

  # Manual trigger (recommended for PROD)
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (e.g., v1.0.0-20260128-164500)"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ENVIRONMENT: production
  HEALTH_CHECK_TIMEOUT: 60

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.head_branch == 'main' ||
         github.event.workflow_run.head_branch == 'feature/cd-ambientes-rollback-approvals'))

    # Manual approval configured in GitHub: Settings -> Environments -> production
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Runner Tooling
        shell: bash
        run: |
          set -euo pipefail
          echo "🔧 Validating runner tooling..."
          for bin in bash curl tar php; do
            command -v "$bin" >/dev/null 2>&1 || { echo "❌ Missing binary: $bin"; exit 1; }
          done

          # Optional: pg_dump for backups
          if command -v pg_dump >/dev/null 2>&1; then
            echo "✅ pg_dump found"
          else
            echo "⚠️ pg_dump not found (backup will be skipped)"
          fi

          # gh CLI is optional (only needed if you later make release_tag optional)
          if command -v gh >/dev/null 2>&1; then
            echo "✅ gh found"
          else
            echo "ℹ️ gh not found (OK for manual release_tag)"
          fi

      #- name: Get Release Tag (manual input)
      #  id: release
      #  shell: bash
      #  run: |
      #    set -euo pipefail
      #    RELEASE_TAG="${{ github.event.inputs.release_tag }}"
      #    if [ -z "$RELEASE_TAG" ]; then
      #      echo "❌ release_tag is required"
      #      exit 1
      #    fi
      #    echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      #    echo "📦 Deploying release: ${RELEASE_TAG}"

      - name: Display Deployment Info
        shell: bash
        run: |
          set -euo pipefail
          echo "## 🚀 Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> [!CAUTION]" >> "$GITHUB_STEP_SUMMARY"
          echo "> This is a PRODUCTION deployment (Self-Hosted)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Release** | \`${{ steps.release.outputs.release_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Approved by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -Iseconds) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-Deploy Checks + Prepare Directories + Write .env
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Running pre-deploy checks..."

          # Required secrets (configure in: Settings -> Environments -> production -> Secrets)
          : "${{ secrets.PROD_PATH }}"
          : "${{ secrets.PROD_URL }}"
          : "${{ secrets.APP_KEY }}"
          : "${{ secrets.DB_HOST }}"
          : "${{ secrets.DB_PORT }}"
          : "${{ secrets.DB_DATABASE }}"
          : "${{ secrets.DB_USERNAME }}"
          : "${{ secrets.DB_PASSWORD }}"

          PROD_PATH="${{ secrets.PROD_PATH }}"

          echo "Runner user: $(whoami)"
          echo "📁 PROD_PATH: ${PROD_PATH}"

          if [ ! -d "${PROD_PATH}" ]; then
            echo "❌ Production directory not found: ${PROD_PATH}"
            exit 1
          fi

          AVAILABLE=$(df -BG "${PROD_PATH}" | awk 'NR==2 {print $4}' | sed 's/G//')
          if [ "${AVAILABLE}" -lt 2 ]; then
            echo "❌ Insufficient disk space: ${AVAILABLE}GB"
            exit 1
          fi
          echo "✅ Disk space: ${AVAILABLE}GB"

          # Create shared structure
          mkdir -p "${PROD_PATH}/shared/storage/app/public"
          mkdir -p "${PROD_PATH}/shared/storage/framework/cache/data"
          mkdir -p "${PROD_PATH}/shared/storage/framework/sessions"
          mkdir -p "${PROD_PATH}/shared/storage/framework/views"
          mkdir -p "${PROD_PATH}/shared/storage/logs"
          mkdir -p "${PROD_PATH}/shared/database/backups"

          # Releases dir
          mkdir -p "${PROD_PATH}/releases"

          # Permissions (prefer pre-provisioned permissions; this is fallback)
          if sudo -n true 2>/dev/null; then
            sudo chown -R www-data:www-data "${PROD_PATH}/shared" "${PROD_PATH}/releases" || true
          fi

          # Write shared .env (do not hardcode DB/user/host; use secrets)
          ENV_FILE="${PROD_PATH}/shared/.env"
          umask 027
          {
            echo 'APP_NAME="Sistema Ventas"'
            echo "APP_ENV=production"
            echo "APP_KEY=${{ secrets.APP_KEY }}"
            echo "APP_DEBUG=false"
            echo "APP_URL=${{ secrets.PROD_URL }}"
            echo ""
            echo "LOG_CHANNEL=stack"
            echo "LOG_LEVEL=error"
            echo ""
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=${{ secrets.DB_HOST }}"
            echo "DB_PORT=${{ secrets.DB_PORT }}"
            echo "DB_DATABASE=${{ secrets.DB_DATABASE }}"
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo ""
            echo "BROADCAST_DRIVER=log"
            echo "CACHE_DRIVER=file"
            echo "FILESYSTEM_DISK=local"
            echo "QUEUE_CONNECTION=sync"
            echo "SESSION_DRIVER=file"
            echo "SESSION_LIFETIME=120"
          } > "${ENV_FILE}"

          if sudo -n true 2>/dev/null; then
            sudo chown www-data:www-data "${ENV_FILE}" || true
          fi

          echo "✅ Shared directory + .env configured"

      - name: Enable Maintenance Mode
        shell: bash
        run: |
          set -euo pipefail
          PROD_PATH="${{ secrets.PROD_PATH }}"
          if [ -d "${PROD_PATH}/current" ]; then
            cd "${PROD_PATH}/current"
            php artisan down --retry=60 --refresh=5 || true
            echo "🔧 Maintenance mode enabled"
          else
            echo "ℹ️ First deploy: current does not exist, skipping maintenance down"
          fi

      - name: Deploy Application (Release + Symlink Switch)
        timeout-minutes: 15
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PROD_PATH="${{ secrets.PROD_PATH }}"
          RELEASE_TAG="${{ steps.release.outputs.release_tag }}"
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          RELEASE_DIR="releases/${TIMESTAMP}"

          ARTIFACT_NAME="sistema-ventas-${RELEASE_TAG}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ARTIFACT_NAME}.tar.gz"

          echo "📦 Downloading release: ${RELEASE_TAG}"
          mkdir -p "/tmp/deploy-${TIMESTAMP}"

          # Download artifact (works for public repos; for private, add Authorization header)
          curl -fL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o "/tmp/deploy-${TIMESTAMP}/${ARTIFACT_NAME}.tar.gz" \
            "${DOWNLOAD_URL}"

          # Download checksum (optional)
          curl -fL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o "/tmp/deploy-${TIMESTAMP}/${ARTIFACT_NAME}.tar.gz.sha256" \
            "${DOWNLOAD_URL}.sha256" || true

          if [ -f "/tmp/deploy-${TIMESTAMP}/${ARTIFACT_NAME}.tar.gz.sha256" ]; then
            echo "🔐 Verifying checksum..."
            (cd "/tmp/deploy-${TIMESTAMP}" && sha256sum -c "${ARTIFACT_NAME}.tar.gz.sha256")
            echo "✅ Checksum verified"
          else
            echo "ℹ️ No checksum provided, skipping verification"
          fi

          cd "${PROD_PATH}"

          echo "📂 Extracting to ${RELEASE_DIR}"
          mkdir -p "${RELEASE_DIR}"
          tar -xzf "/tmp/deploy-${TIMESTAMP}/${ARTIFACT_NAME}.tar.gz" -C "${RELEASE_DIR}"

          echo "🔗 Creating symlinks to shared"
          rm -rf "${RELEASE_DIR}/storage"
          ln -sfn "${PROD_PATH}/shared/storage" "${RELEASE_DIR}/storage"
          ln -sfn "${PROD_PATH}/shared/.env" "${RELEASE_DIR}/.env"

          echo "📁 Ensuring release cache dirs"
          mkdir -p "${RELEASE_DIR}/bootstrap/cache"
          chmod -R 775 "${RELEASE_DIR}/bootstrap/cache" || true
          chmod -R 775 "${PROD_PATH}/shared/storage" || true

          echo "🔒 Setting permissions"
          if sudo -n true 2>/dev/null; then
            sudo chown -R www-data:www-data "${RELEASE_DIR}" "${PROD_PATH}/shared/storage" || true
            sudo find "${RELEASE_DIR}" -type f -exec chmod 644 {} \; || true
            sudo find "${RELEASE_DIR}" -type d -exec chmod 755 {} \; || true
            sudo chmod -R 775 "${PROD_PATH}/shared/storage" "${RELEASE_DIR}/bootstrap/cache" || true
          else
            find "${RELEASE_DIR}" -type f -exec chmod 644 {} \; || true
            find "${RELEASE_DIR}" -type d -exec chmod 755 {} \; || true
            chmod -R 775 "${PROD_PATH}/shared/storage" "${RELEASE_DIR}/bootstrap/cache" 2>/dev/null || true
          fi

          echo "🗃️ Creating database backup (custom format .dump)"
          if command -v pg_dump >/dev/null 2>&1; then
            set +e
            # Load DB vars from shared .env safely (only for this step)
            set -a
            source "${PROD_PATH}/shared/.env"
            set +a
            PGPASSWORD="${DB_PASSWORD}" pg_dump -h "${DB_HOST}" -U "${DB_USERNAME}" -Fc "${DB_DATABASE}" \
              > "${PROD_PATH}/shared/database/backups/pre-${TIMESTAMP}.dump"
            RC=$?
            set -e
            if [ $RC -eq 0 ]; then
              echo "✅ Backup saved: pre-${TIMESTAMP}.dump"
            else
              echo "⚠️ Backup skipped/failure (non-blocking)"
            fi
          else
            echo "⚠️ pg_dump not available, skipping backup"
          fi

          echo "🔄 Running migrations"
          cd "${RELEASE_DIR}"
          php artisan config:clear || true
          php artisan migrate --force

          echo "⚡ Atomic switch"
          cd "${PROD_PATH}"

          PREVIOUS="$(readlink -f current 2>/dev/null || echo "")"
          if [ -n "${PREVIOUS}" ]; then
            echo "${PREVIOUS}" > shared/.previous_release
          fi

          ln -sfn "${PROD_PATH}/${RELEASE_DIR}" current.new
          mv -Tf current.new current

          echo "🔃 Reloading services"
          if sudo -n true 2>/dev/null; then
            sudo systemctl reload php8.4-fpm || sudo systemctl reload php8.2-fpm || true
            sudo nginx -s reload || true
            sudo supervisorctl restart sistema-ventas-worker:* 2>/dev/null || true
          else
            echo "⚠️ sudo not available, skipping service reload"
          fi

          echo "🧹 Cleanup temp"
          rm -rf "/tmp/deploy-${TIMESTAMP}"

          echo "🧹 Cleanup old releases (keep last 3)"
          cd "${PROD_PATH}/releases"
          ls -t | tail -n +4 | xargs -r rm -rf

          echo "✅ Deployment complete"

      - name: Disable Maintenance Mode
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ secrets.PROD_PATH }}/current"
          php artisan up || true
          echo "✅ Maintenance mode disabled"

      - name: Health Check (non-blocking)
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "🏥 Running health checks..."
          sleep 10

          HEALTH_URL="${{ secrets.PROD_URL }}/api/health"

          for i in 1 2 3; do
            echo "Attempt $i/3..."
            RESPONSE="$(curl -sS -w '\n%{http_code}' --max-time ${{ env.HEALTH_CHECK_TIMEOUT }} "${HEALTH_URL}" || true)"
            HTTP_CODE="$(echo "$RESPONSE" | tail -1)"
            BODY="$(echo "$RESPONSE" | sed '$d' | head -c 800)"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed"
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "⚠️ Health check HTTP=${HTTP_CODE} body=${BODY}"
            sleep 5
          done

          echo "⚠️ Health check failed after 3 attempts (deployment still successful)"
          echo "passed=false" >> "$GITHUB_OUTPUT"

      - name: Rollback on Failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          PROD_PATH="${{ secrets.PROD_PATH }}"
          cd "${PROD_PATH}"

          PREVIOUS=""
          if [ -f "shared/.previous_release" ]; then
            PREVIOUS="$(cat shared/.previous_release || true)"
          fi

          if [ -z "$PREVIOUS" ]; then
            CANDIDATE="$(ls -t releases | sed -n '2p' || true)"
            if [ -n "$CANDIDATE" ]; then
              PREVIOUS="${PROD_PATH}/releases/${CANDIDATE}"
            fi
          fi

          if [ -n "$PREVIOUS" ] && [ -d "$PREVIOUS" ]; then
            echo "🔙 Rolling back to: ${PREVIOUS}"
            ln -sfn "$PREVIOUS" current.new
            mv -Tf current.new current

            cd current
            php artisan up || true

            if sudo -n true 2>/dev/null; then
              sudo systemctl reload php8.4-fpm || sudo systemctl reload php8.2-fpm || true
              sudo nginx -s reload || true
            fi

            echo "✅ Rollback complete"
          else
            echo "❌ No previous release found for rollback"
            cd "${PROD_PATH}/current" 2>/dev/null && php artisan up || true
          fi